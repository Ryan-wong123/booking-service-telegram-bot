# Production on a single EC2 instance, with zero-downtime deploys (see deploy/deploy.sh):
#   first start:  docker compose -f docker-compose.prod.yml up -d --build
#   later deploys: ./deploy/deploy.sh
# Caddy (HTTPS, load balancer) -> web1 + web2 (gunicorn) -> db (PostgreSQL on the instance's disk).
x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql://booking:${POSTGRES_PASSWORD}@db:5432/booking
    WEB_CONCURRENCY: "2"        # gunicorn workers per replica (2 replicas x 2 workers fits a 2 GiB instance)

# Rotate container logs so they can never fill the disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# One image for everything the app runs (built once, cached on the others).
x-app-build: &app-build
  build: .
  image: booking-web:local

x-web: &web
  <<: [*app-build, *app-env, *logging]
  expose:
    - "8000"                    # reachable only from Caddy on the internal network
  stop_grace_period: 35s        # lets gunicorn finish in-flight requests (graceful-timeout is 30s)
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 15s
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro   # a directory (not a single file) so `caddy reload` sees edits after git pull
      - caddy_data:/data               # certificates: keep, or Let's Encrypt rate limits can lock you out
      - caddy_config:/config
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
    restart: unless-stopped
    <<: *logging

  web1:
    <<: *web

  web2:
    <<: *web

  init:                         # applies migrations and seeds the first super admin
    <<: [*app-build, *app-env, *logging]
    command: ["flask", "init-db"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  reminders:                    # emails appointment reminders; idempotent
    <<: [*app-build, *app-env, *logging]
    command: ["sh", "-c", "while true; do flask send-reminders; sleep 300; done"]
    init: true                  # forwards SIGTERM so it stops promptly on redeploy
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # lives on the instance's EBS volume (snapshotted daily)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    <<: *logging

  backup:                       # on demand / from cron:  docker compose -f docker-compose.prod.yml run --rm backup
    build: ./backup
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-booking}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      HOME: /tmp
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: booking_pgdata
  caddy_data:
  caddy_config:
