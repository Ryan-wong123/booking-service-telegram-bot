{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card shadow-sm"><div class="card-body">
    <h4>My account</h4>
    <p class="text-muted">{{ current_user.name }} · {{ current_user.email }} · {{ current_user.role }}</p>
    <h6>Change password</h6>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Current password</label>
        <input class="form-control" type="password" name="current" required autocomplete="current-password"></div>
      <div class="mb-3"><label class="form-label">New password <span class="text-muted small">(min {{ config.MIN_PASSWORD_LENGTH }})</span></label>
        <input class="form-control" type="password" name="password" required autocomplete="new-password"></div>
      <div class="mb-3"><label class="form-label">Confirm new password</label>
        <input class="form-control" type="password" name="confirm" required autocomplete="new-password"></div>
      <button class="btn btn-primary">Update password</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
