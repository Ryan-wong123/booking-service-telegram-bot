{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Create a customer account</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Full name</label>
        <input class="form-control" name="name" value="{{ name or '' }}" required maxlength="120"></div>
      <div class="mb-3"><label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" value="{{ email or '' }}" required></div>
      <div class="mb-3"><label class="form-label">Password <span class="text-muted small">(min {{ config.MIN_PASSWORD_LENGTH }} characters)</span></label>
        <input class="form-control" type="password" name="password" required minlength="{{ config.MIN_PASSWORD_LENGTH }}"></div>
      <div class="mb-3"><label class="form-label">Confirm password</label>
        <input class="form-control" type="password" name="confirm" required></div>
      <button class="btn btn-primary w-100">Create account</button>
    </form>
    <p class="mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div></div>
</div></div>
{% endblock %}
