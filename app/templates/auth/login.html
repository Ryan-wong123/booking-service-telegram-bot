{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Log in</h4>
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" name="email" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" name="password" required></div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="mt-3 mb-0 small"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
    {% if config.ALLOW_REGISTRATION %}<p class="mt-3 mb-0 small">New customer? <a href="{{ url_for('auth.register') }}">Create an account</a></p>{% endif %}
  </div></div>
</div></div>
{% endblock %}
