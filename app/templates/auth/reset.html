{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Choose a new password</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">New password <span class="text-muted small">(min {{ config.MIN_PASSWORD_LENGTH }})</span></label>
        <input class="form-control" type="password" name="password" required minlength="{{ config.MIN_PASSWORD_LENGTH }}" autocomplete="new-password" autofocus></div>
      <div class="mb-3"><label class="form-label">Confirm password</label>
        <input class="form-control" type="password" name="confirm" required autocomplete="new-password"></div>
      <button class="btn btn-primary w-100">Change password</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
