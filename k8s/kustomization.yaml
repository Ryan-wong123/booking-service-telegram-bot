apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: booking
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - backup-cronjob.yaml
  # init-job.yaml is applied separately, after the secret exists (see docs).
images:
  - name: booking-portal
    newName: booking-portal
    newTag: "1.0.0"
