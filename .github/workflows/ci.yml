name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt pyflakes
      - name: Lint
        run: pyflakes app tests wsgi.py
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_test
      - name: Migrations apply cleanly to PostgreSQL
        run: flask --app wsgi init-db
        env:
          DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_test
          SECRET_KEY: ci

  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: booking-portal:ci
      - name: Smoke-test the web image
        run: |
          docker run -d --name web -p 8000:8000 -e APP_ENV=production -e SECRET_KEY=ci \
            -e DATABASE_URL=postgresql://x:x@127.0.0.1:1/x booking-portal:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/healthz && exit 0; sleep 1; done
          docker logs web; exit 1
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: backup
          push: false
          tags: booking-backup:ci

  # Proves the zero-downtime claim: bring up the production stack, send continuous traffic through Caddy,
  # run deploy/deploy.sh (replaces both app replicas), and fail if any single request was not a 200.
  zero-downtime:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure production .env (DOMAIN=localhost uses Caddy's internal CA, no Let's Encrypt)
        run: |
          cp .env.example .env
          sed -i -e 's/^APP_ENV=.*/APP_ENV=production/' \
                 -e 's/^SECRET_KEY=.*/SECRET_KEY=ci-secret-key-not-for-production/' \
                 -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password/' \
                 -e 's/^DOMAIN=.*/DOMAIN=localhost/' \
                 -e 's/^ACME_EMAIL=.*/ACME_EMAIL=ci@example.com/' .env
      - name: Start the production stack
        run: |
          docker compose -f docker-compose.prod.yml up -d --build
          for i in $(seq 1 60); do curl -ksf https://localhost/readyz && break; sleep 2; done
          curl -ksf https://localhost/readyz
      - name: Deploy while sending continuous traffic
        run: |
          : > codes.txt
          ( while true; do curl -ks -m 5 -o /dev/null -w '%{http_code}\n' https://localhost/login >> codes.txt || true; sleep 0.05; done ) &
          LOOP=$!
          sleep 3
          ./deploy/deploy.sh
          sleep 3
          kill $LOOP || true
          echo "Response codes during the deploy:"; sort codes.txt | uniq -c
          total=$(wc -l < codes.txt); bad=$(grep -vc '^200$' codes.txt || true)
          echo "requests=$total non-200=$bad"
          [ "$total" -gt 150 ]   # the test really exercised the deploy
          [ "$bad" -eq 0 ]       # zero failed requests
      - name: Site still healthy afterwards
        run: curl -ksf https://localhost/readyz
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=100
