# k3s ships Traefik as the default ingress controller (class "traefik").
# Replace booking.example.com with your domain. For HTTPS see docs/DEPLOY_AWS_EC2.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booking-web
  namespace: booking
spec:
  ingressClassName: traefik
  rules:
    - host: booking.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: booking-web
                port: { number: 80 }
