# Local / single-host run:  cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # localhost only, for local development; remove in production
    volumes:
      # Persistent volume: data survives `docker compose down` / container rebuilds.
      # (Only `docker compose down -v` deletes it.)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    build: .
    command: ["flask", "init-db"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://booking:${POSTGRES_PASSWORD}@db:5432/booking
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://booking:${POSTGRES_PASSWORD}@db:5432/booking
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
    name: booking_pgdata
