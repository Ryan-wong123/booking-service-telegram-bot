<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
  <h2>Welcome, Admin</h2>
  <form method="post">
    Staff ID: <input type="number" name="staff_id" required><br>
    Date: <input type="date" name="date" required><br>
    Time: <input type="time" name="time" required><br>
    <button type="submit">Add Slot</button>
  </form>
  <h3>Current Slots:</h3>
  <ul>
    {% for slot in slots %}
      <li>
        Staff {{ slot[1] }} → {{ slot[2] }} at {{ slot[3] }}
        <a href="{{ url_for('delete_slot', id=slot[0]) }}">❌ Delete</a>
      </li>
    {% endfor %}
  </ul>
  <a href="/logout">Logout</a>
</body>
</html>
