{% extends "base.html" %}
{% block title %}Service{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
<div class="card shadow-sm"><div class="card-body">
  <h4>{{ 'Edit service' if service else 'Add service' }}</h4>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Name</label>
      <input class="form-control" name="name" required maxlength="120" value="{{ form.get('name', service.name if service else '') }}"></div>
    <div class="mb-3"><label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="2" maxlength="500">{{ form.get('description', service.description if service else '') }}</textarea></div>
    <div class="mb-3"><label class="form-label">Duration (minutes)</label>
      <input class="form-control" type="number" name="duration_minutes" min="5" max="480" required value="{{ form.get('duration_minutes', service.duration_minutes if service else 30) }}"></div>
    <div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="use_zoom" id="use_zoom" {{ 'checked' if (form and form.get('use_zoom')) or (not form and service and service.use_zoom) }}>
      <label class="form-check-label" for="use_zoom">Create a Zoom meeting for each booking</label>
      {% if not config.ZOOM_CLIENT_ID %}<div class="form-text">Zoom is not configured on the server, so no links will be created.</div>{% endif %}</div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="active" id="svc_active" {{ 'checked' if (form and form.get('active')) or (not form and (not service or service.active)) }}>
      <label class="form-check-label" for="svc_active">Active (visible to customers)</label></div>
    <button class="btn btn-primary">Save</button> <a class="btn btn-link" href="{{ url_for('admin.services') }}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
