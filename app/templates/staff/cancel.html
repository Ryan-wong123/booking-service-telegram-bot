{% extends "base.html" %}
{% block title %}Cancel booking{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
<div class="card shadow-sm border-danger"><div class="card-body">
  <h4>Cancel this booking?</h4>
  <p><strong>{{ booking.slot.start_at|dt }}</strong><br>{{ booking.customer.name }} · {{ booking.slot.service.name }}</p>
  <form method="post" action="{{ post_url|default(url_for('staff.cancel_booking', booking_id=booking.id)) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Reason (shown to the customer)</label>
      <input class="form-control" name="reason" maxlength="300" required></div>
    <button class="btn btn-danger">Cancel booking</button>
    <a class="btn btn-link" href="javascript:history.back()">Back</a>
  </form>
</div></div></div></div>
{% endblock %}
